<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configurações</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      display: flex;
      justify-content: center;
      padding: 40px;
    }

    .container {
      background: white;
      padding: 20px;
      border-radius: 8px;
      width: 320px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    h2 {
      margin-top: 0;
      text-align: center;
    }

    .campo {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }

    input, select {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
    }

    .checkbox {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    button {
      width: 100%;
      padding: 10px;
      background: #0078d4;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover {
      background: #005fa3;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Configurações</h2>

  <form>
    <div class="campo">
      <label for="nome">Nome</label>
      <input type="text" id="nome" placeholder="Digite seu nome">
    </div>

    <div class="campo">
      <label for="tema">Tema</label>
      <select id="tema">
        <option>Claro</option>
        <option>Escuro</option>
      </select>
    </div>

    <div class="campo checkbox">
      <input type="checkbox" id="notificacoes">
      <label for="notificacoes">Receber notificações</label>
    </div>

    <button type="submit">Salvar</button>
  </form>
</div>

</body>
</html>
